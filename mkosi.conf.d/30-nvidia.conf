# Proprietary NVIDIA driver (required in 1.0, decision 15.11.2026).
# Not in Fedora repos: comes from RPM Fusion nonfree. Kernel modules must be
# prebuilt for the image kernel (akmods cannot build on a read-only /usr) and
# signed with the Liquid OS Secure Boot key. See docs/NVIDIA.md.
# Disabled until the RPM Fusion repo file is added to mkosi.sandbox/.
[Match]
Environment=LIQUID_NVIDIA=1

[Content]
Packages=
        xorg-x11-drv-nvidia
        xorg-x11-drv-nvidia-cuda-libs
        nvidia-modprobe
