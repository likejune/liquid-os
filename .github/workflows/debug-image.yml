name: debug-image
on:
  push:
    branches: [fix/full-build]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: liquid-os-image
          run-id: 43995498232
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: mkosi.output
      - name: Check repart definitions
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y systemd-container btrfs-progs
          image=$(find mkosi.output -name '*_0.9.1.raw' -print -quit)
          mkdir -p /tmp/liquid-root
          trap 'sudo systemd-dissect --umount /tmp/liquid-root || true' EXIT
          sudo systemd-dissect --mount "$image" /tmp/liquid-root
          sudo ls -l /tmp/liquid-root/sbin/init /tmp/liquid-root/usr/lib/systemd/systemd
          sudo systemd-repart --definitions=/tmp/liquid-root/usr/lib/repart.d --dry-run=yes "$image"
