name: release
# Build a signed image on a version tag and publish it as an update.
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: systemd/mkosi@v25.3
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Restore signing keys
        env:
          MKOSI_KEY: ${{ secrets.MKOSI_KEY }}
          MKOSI_CRT: ${{ secrets.MKOSI_CRT }}
        run: |
          printf '%s' "$MKOSI_KEY" > mkosi.key
          printf '%s' "$MKOSI_CRT" > mkosi.crt
      - name: Build signed image
        env:
          LIQUID_UPDATE_URL: ${{ vars.LIQUID_UPDATE_URL }}
        run: |
          export FLATHUB_GPG_KEY=$(curl -fsSL https://dl.flathub.org/repo/flathub.gpg | base64 -w0)
          mkosi -f --secure-boot --environment=FLATHUB_GPG_KEY --environment=LIQUID_UPDATE_URL build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mkosi.output/*.raw
            mkosi.output/*.efi
          body_path: docs/RELEASE-NOTES.md
