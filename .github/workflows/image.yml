name: image
on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Existing successful kernel run to reuse instead of rebuilding
        required: false
      desktop_run_id:
        description: Existing successful desktop run to reuse instead of rebuilding
        required: false
  push:
    tags: ['v*']
jobs:
  kernel:
    if: github.event_name != 'workflow_dispatch' || inputs.kernel_run_id == ''
    uses: ./.github/workflows/kernel.yml
  desktop:
    if: github.event_name != 'workflow_dispatch' || inputs.desktop_run_id == ''
    uses: ./.github/workflows/desktop.yml
  build:
    if: >-
      always() &&
      (needs.kernel.result == 'success' || needs.kernel.result == 'skipped') &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
    needs: [kernel, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download Liquid kernel
        if: github.event_name != 'workflow_dispatch' || inputs.kernel_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: liquid-kernel
          path: mkosi.packages
      - name: Download kernel from existing run
        if: github.event_name == 'workflow_dispatch' && inputs.kernel_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: liquid-kernel
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: mkosi.packages
      - name: Download Liquid desktop
        if: github.event_name != 'workflow_dispatch' || inputs.desktop_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: liquid-desktop
          path: mkosi.extra/usr
      - name: Download desktop from existing run
        if: github.event_name == 'workflow_dispatch' && inputs.desktop_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: liquid-desktop
          run-id: ${{ inputs.desktop_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: mkosi.extra/usr
      - uses: systemd/mkosi@v25.3
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Build image
        env:
          LIQUID_UPDATE_URL: ${{ vars.LIQUID_UPDATE_URL }}
        run: |
          export FLATHUB_GPG_KEY=$(curl -fsSL https://dl.flathub.org/repo/flathub.gpg | base64 -w0)
          mkosi -f build --environment=FLATHUB_GPG_KEY --environment=LIQUID_UPDATE_URL
      - name: Boot test in QEMU
        run: bash scripts/test-image.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquid-os-image
          path: |
            mkosi.output/*.raw
            mkosi.output/*.efi
          if-no-files-found: warn
      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-os-boot-log
          path: boot.log
          if-no-files-found: warn
