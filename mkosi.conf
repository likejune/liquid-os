# Liquid OS image definition (mkosi). Builds an atomic, image-based OS:
# read-only /usr partition with dm-verity, A/B updates via systemd-sysupdate,
# unified kernel images with boot counting for automatic rollback.
# Approach follows systemd's ParticleOS. Ready-made packages are pulled from
# Fedora repositories at build time; the user never sees a package manager.

[Distribution]
Distribution=fedora
Release=44

[Output]
ImageId=liquid-os
ImageVersion=0.9.1
Format=disk
OutputDirectory=mkosi.output
SplitArtifacts=yes

[Build]
ToolsTree=default

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
KernelCommandLine=rw quiet splash loglevel=3 rd.systemd.show_status=auto
Hostname=liquid
Locale=ru_RU.UTF-8
Keymap=ru
Timezone=Europe/Moscow
RemoveFiles=/usr/lib/os-release.d
# Packages are split by role in mkosi.conf.d/

[Validation]
# Enable after generating keys with: mkosi genkey
# SecureBoot=yes
# SecureBootKey=mkosi.key
# SecureBootCertificate=mkosi.crt
# Verity=signed
